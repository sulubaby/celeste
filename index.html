<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mountain Platformer</title>
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>

  <main id="game">
    <!-- Background layers -->
    <section id="bg-layer" class="layer"></section>
    <section id="mid-layer" class="layer"></section>

    <!-- Gameplay layer -->
    <section id="platform-layer" class="layer"></section>
    <section id="player-layer" class="layer">
      <div id="player"></div>
    </section>

    <!-- UI layer -->
    <section id="ui-layer">
      <div id="scoreboard">
        <span>Time: <strong id="time">0</strong></span>
        <span>Score: <strong id="score">0</strong></span>
        <span>Lives: <strong id="lives">3</strong></span>
        <span>FPS: <strong id="fps">0</strong></span>
      </div>

      <div id="pause-menu" class="hidden">
        <h1>Paused</h1>
        <button id="continue-btn">Continue</button>
        <button id="restart-btn">Restart</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
